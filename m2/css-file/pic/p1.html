<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;;
        }
        .p1 img{
            width: 100%;
            border: 2px solid goldenrod;
           height: 400px;
           align-items: center;
        }
        .box h1{
            font-size: 3em;
            color: goldenrod;
            font-weight: 700;
            display:flex ;
            justify-content: center;
            align-items: center;
        }
        .box p{
            font-size: 20px;
            color: rgb(29, 21, 1);
            font-weight: 400;
        }
        .p1{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        @media screen and (max-width:767px) {
            body{
                background-color: rgb(129, 129, 48);
            }
            .p1{
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 30px;  
            }
            .box h1{
            font-size: 1em;
            color: rgb(56, 3, 3);
            font-weight: 500;
            display:flex ;
            justify-content: center;
            align-items: center;
            

        }
    }
        @media screen and (max-width:1024px) and (min-width:768px) {
             body{
                background-color: rgb(58, 226, 212);
            }
            .p1{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;  
            }
            .box h1{
            font-size: 2em;
            color: rgb(192, 111, 111);
            font-weight: 600;
            display:flex ;
            justify-content: center;
            align-items: center;
           

        }
    }
        @media screen and (min-width:1125px) {
            body{
                background-color: beige;
            }
            .p1{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;  
            }
            .box h1{
            font-size: 3em;
            color: rgb(182, 134, 3);
            font-weight: 700;
            display:flex ;
            justify-content: center;
            align-items: center;
            

        }
    }
    </style>
</head>
<body>
    <div class="box">
        <h1>CSS Layout Content</h1>
        <div class="p1">
            <img src="./p/images (10).jpeg" alt="">
            <img src="./p/images (6).jpeg" alt="">
            <img src="./p/images (8).jpeg" alt="">
            <img src="./p/images (9).jpeg" alt="">
            <img src="./p/pexels-mag-photography-1501456-30532036.jpg" alt="">
            <img src="./p/pexels-tom-d-arby-3904203-6758858.jpg">
        </div>
        <p>
           There are tons of different layout designs to choose from. However, the structure above, is one of the most common, and we will take a closer look at it in this tutorial. A header is usually located at the top of the website, and often contains a logo or the website name:
        </p>
    </div>
</body>
</html>
