<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>picture grid</title>
    <style>
        .container{
            display:grid;
              gap: 10px;
            grid-template-columns: repeat(4 ,1fr);
            grid-template-rows: repeat(5,1fr);
        }
        .box img{
           
            height: 100%;
            width: 100%;
            
        }
        #first-pic{
            grid-column: span 4 ;
        }
        
        #third{
            grid-column: span 3;
        }
        @media screen and (max-width:576px){
            .container{
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="first-pic" class=" box "><img src="./p/images (6).jpeg" alt=""></div>
        <div id="second-pic" class="box"><img src="./p/images (8).jpeg" alt=""></div>
        <div id="second-pic" class="box"><img src="./p/images (8).jpeg" alt=""></div>
        <div class="box"><img src="./p/images (9).jpeg" alt=""></div>
        <div class="box"><img src="./p/images (9).jpeg" alt=""></div>
        <div class="box"><img src="./p/images (10).jpeg" alt=""></div>

        <div id="third" class="box"><img src="./p/pexels-mag-photography-1501456-30532036.jpg" alt=""></div>
        <div id="first-pic" class="box"><img src="./p/pexels-tom-d-arby-3904203-6758858.jpg" alt=""></div>
        <div id="first-pic" class="box"><img src="./p/images (6).jpeg" alt=""></div>
    </div>
</body>
</html>
