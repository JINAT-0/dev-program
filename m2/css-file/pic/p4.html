<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid for me</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            padding: 20px;
            grid-template-columns: repeat(4,200px) 50px 50px;
            grid-template-rows: repeat(3,200px) 50px 50px 50px  50px;
        }
        .box{
            background-color: gray;
        }
        .side-bar{
            grid-row: span 5;
        }
        .footer-up{
            grid-column: span 3;
        }
        .footer-down{
             grid-column: span 6;
        }
        .side-bar2{
            grid-row: span 5; 
        }
        .red{
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class=" container">
        <div class="box side-bar">box-1</div>
        <div class="box">box-2</div>
        <div class="box">box-3</div>
        <div class="box">box-4</div>
        <div class="box side-bar2">box-5</div>
        <div class="box side-bar2">box-6</div>
        <div class="box">box-7</div>
        <div class="box red">box-8</div>
        <div class="box">box-9</div>
        <div class="box">box-10</div>
        <div class="box">box-11</div>
        <div class="box">box-12</div>
        <div class="box footer-up">box-13</div>
        <div class="box footer-up">box-14</div>
        <div class="box footer-down">box-15</div>
        <div class="box footer-down">box-16</div>
    </div>
</body>
</html>
