<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Card</title>
    <style>
        .card{
            width: 320px;
            height: 400px;
            border: 1px solid rgb(175, 173, 173);
            border-radius:10px ;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            
        }
        .pic h2{
            height: 80px;
            width: 80px;
            color: white;
            font-weight: 700;
            background-color:aqua;
            border-radius: 100px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 77px;
            left: 120px;
            border: 5px solid white;
        }
        .pic h5{
            height: 105px;
            width: 100%;
            color: white;
            background-color: blue;
            border-radius: 10px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .pic{
            position: relative;
        }
        .bannar1{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding-top:80px ;
            
            

        }
        .bannar1 .intro h3{
            color: black;
            font-weight: 700;
            margin: 0;
            padding: 0;
        
        }
        .bannar1 .intro h5{
            color: rgb(78, 74, 74);
            font-weight: 400;
            margin: 0;
            padding: 0;
        }
        .flex{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            
        }
        .flex .btn{
            display: flex;
            justify-content: center;
            align-items: center;
            color: blue;
            width: 60px;
            height: 25px;
            border-radius: 50px;
            background-color: rgb(215, 208, 245);
            
            border: none;
        }
        .intro{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            

        }
        .Team-card{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .black{
            position: absolute;
            background-color:black ;
            left: 0;
            bottom: -100%;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transition: bottom 0.40s ease;
            width: 100%;
            height: 220px;
            border-radius:10px ;
        }
        .btn-2{
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 30px;
            border-radius: 50px;
            background-color: rgb(76, 54, 179);
            
            border: none;
        }
        .card:hover .black{
            bottom: 0;
        }

    </style>
</head>
<body>
   <section class="Team-card">
     <div class="card">
        
        
            <div class="pic">
                <h5>gradient cover</h5>
                <h2>AR</h2>
            </div>
            <div class="bannar1">
               <div class="intro">
                 <h3>Name trunvates with ellipsis..</h3>
                 </div>
                 <div class="intro">
                <h5>Frontend Developer</h5>
               </div>
                <div class="flex">
                    <button class="btn">chip</button>
                    <button class="btn">chip</button>
                    <button class="btn">chip</button>
                </div>
            </div>
        
    
    </div>
         <div class="card">
        
        
            <div class="pic">
                <h5>gradient cover</h5>
                <h2>AR</h2>
            </div>
            <div class="bannar1">
               <div class="intro">
                 <h3>Name trunvates with ellipsis..</h3>
                 </div>
                 <div class="intro">
                <h5>Frontend Developer</h5>
               </div>
                <div class="flex">
                    <button class="btn">chip</button>
                    <button class="btn">chip</button>
                    <button class="btn">chip</button>
                </div>
            </div>
            <div class="black">
                <p>overlay slides up</p>
                <button class="btn-2">view profile</button>
            </div>
        
    
    </div>
   </section>
</body>
</html>
