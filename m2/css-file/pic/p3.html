<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gird template</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3, 200px) 50px 50px;
           

        }
        .box{
          
            
             background-color: gray;
             padding:10px ;
        }
        #side-bar{
            grid-row: span 5;
        }
        .footer
        {
            grid-column: span 3;
        }
        .red{
            background-color:darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="side-bar" class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box red">6</div>
        <div class="box red">7</div>
        <div class="box">8</div>
        <div class="box red">9</div>
        <div class="box red">10</div>
        <div class="box footer">11</div>
        <div class="box footer">12</div>
    </div>
</body>
</html>
